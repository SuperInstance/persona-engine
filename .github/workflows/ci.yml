name: CI

on:
  push:
    branches: [ main, production-round3-2026-07-10 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pydantic pytest
      - name: Import check
        run: |
          python -c "from persona_engine.schemas.persona import Persona; print('✅ schemas OK')"
          python -c "from persona_engine.compose.engine import CompositionEngine; print('✅ compose OK')"
          python -c "from persona_engine.groove.engine import GrooveEngine; print('✅ groove OK')"
      - name: Unit tests (schemas, compose text logic, groove math)
        run: pytest tests/ -v
      - name: Decompose check (optional heavy dependency, not core correctness)
        run: python -c "
          try:
            from persona_engine.decompose.pipeline import DecompositionPipeline;
            print('✅ decompose OK')
          except ImportError as e:
            print(f'⚠️ opensmile not available: {e}')
          "
